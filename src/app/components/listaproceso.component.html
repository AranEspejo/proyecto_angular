<div class="container mx-auto p-4">
    <h1 class="text-4xl font-extrabold text-gray-800 mb-4">Gestión de Procesos</h1>
    <h2 class="text-2xl font-semibold text-gray-700 mb-6">Listado de Procesos</h2>

    <!-- Controles y Filtros -->
    <div class="flex flex-col sm:flex-row gap-4 mb-6 items-center">
        <!-- Botón de Creación (HU-04) -->
        <button 
            (click)="crearNuevoProceso()" 
            class="bg-green-600 text-white px-6 py-2 rounded-lg shadow-md hover:bg-green-700 transition duration-150 w-full sm:w-auto">
            CREAR Nuevo Proceso
        </button>

        <!-- Filtro de Búsqueda por Texto -->
        <input
            type="text"
            [(ngModel)]="filtroTexto"
            (ngModelChange)="aplicarFiltros()"
            placeholder="Buscar por nombre o descripción..."
            class="p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 w-full sm:w-64"
        />

        <!-- Filtro por Estado -->
        <select 
            [(ngModel)]="filtroEstado" 
            (ngModelChange)="aplicarFiltros()"
            class="p-2 border border-gray-300 rounded-lg w-full sm:w-40"
        >
            <option value="todos">Filtrar por Estado</option>
            <option value="publicado">Publicado</option>
            <option value="borrador">Borrador</option>
            <option value="inactivo">Inactivo</option>
        </select>

        <!-- Filtro por Categoría (Corrección: Añadido (ngModelChange)) -->
        <select 
            [(ngModel)]="filtroCategoria" 
            (ngModelChange)="aplicarFiltros()"
            class="p-2 border border-gray-300 rounded-lg w-full sm:w-48"
        >
            <option value="todos">Filtrar por Categoría</option>
            <!-- Renderiza las categorías disponibles -->
            <option *ngFor="let cat of categoriasDisponibles" [value]="cat">
                {{ cat }}
            </option>
        </select>
    </div>

    <!-- Listado de Procesos -->
    <div class="space-y-4">
        <div *ngIf="procesosFiltrados.length === 0" class="text-center p-8 bg-white rounded-lg shadow-inner text-gray-500">
            No se encontraron procesos que coincidan con los filtros aplicados.
        </div>

        <div *ngFor="let proceso of procesosFiltrados" class="bg-white p-5 rounded-xl shadow-md border-l-4"
             [ngClass]="{
                'border-green-500': proceso.estado === 'publicado',
                'border-yellow-500': proceso.estado === 'borrador',
                'border-red-500': proceso.estado === 'inactivo'
             }">
            
            <h3 class="text-xl font-bold text-gray-900">
                {{ proceso.nombre }}
                <span class="text-sm font-normal text-gray-500 ml-2">({{ proceso.categoria }})</span>
                <span class="text-xs font-semibold px-2 py-0.5 rounded-full uppercase ml-2"
                      [ngClass]="{
                          'bg-green-100 text-green-800': proceso.estado === 'publicado',
                          'bg-yellow-100 text-yellow-800': proceso.estado === 'borrador',
                          'bg-red-100 text-red-800': proceso.estado === 'inactivo'
                      }">
                    {{ proceso.estado }}
                </span>
            </h3>
            
            <p class="text-gray-600 mt-1">{{ proceso.descripcion }}</p>
            
            <button class="mt-3 text-indigo-600 hover:text-indigo-800 font-medium text-sm">
                Ver Detalles
            </button>
        </div>
    </div>
</div>
