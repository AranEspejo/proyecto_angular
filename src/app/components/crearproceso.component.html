<div class="container mx-auto p-8 max-w-2xl bg-white rounded-xl shadow-2xl mt-10">
    <h1 class="text-3xl font-extrabold text-gray-800 mb-2">Crear Nuevo Proceso</h1>
    <p class="text-gray-600 mb-6 border-b pb-3">
        Aquí registrará el nombre, descripción y categoría del nuevo flujo de trabajo.
    </p>

    <!-- Formulario de Creación -->
    <form (ngSubmit)="onSubmit()" class="space-y-6">

        <!-- Campo: Nombre -->
        <div>
            <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre del Proceso</label>
            <input 
                id="nombre" 
                type="text" 
                name="nombre" 
                [(ngModel)]="nuevoProceso.nombre" 
                required
                class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition duration-150"
                placeholder="Ej: Proceso de Incorporación, Cierre Mensual, etc."
            >
        </div>

        <!-- Campo: Descripción -->
        <div>
            <label for="descripcion" class="block text-sm font-medium text-gray-700 mb-1">Descripción Detallada</label>
            <textarea 
                id="descripcion" 
                name="descripcion" 
                [(ngModel)]="nuevoProceso.descripcion" 
                required
                rows="3"
                class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition duration-150"
                placeholder="Detalle el objetivo y el alcance de este proceso."
            ></textarea>
        </div>

        <!-- Campo: Categoría -->
        <div>
            <label for="categoria" class="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
            <select 
                id="categoria" 
                name="categoria" 
                [(ngModel)]="nuevoProceso.categoria" 
                required
                class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 bg-white"
            >
                <option value="" disabled selected>Seleccione una categoría</option>
                <!-- Usamos *ngFor para poblar la lista de categorías desde el TS -->
                <option *ngFor="let cat of categoriasDisponibles" [value]="cat">
                    {{ cat }}
                </option>
            </select>
        </div>

        <!-- Campo: Estado Inicial (Por defecto, "Borrador") -->
        <div>
            <label for="estado" class="block text-sm font-medium text-gray-700 mb-1">Estado Inicial</label>
            <select 
                id="estado" 
                name="estado" 
                [(ngModel)]="nuevoProceso.estado" 
                required
                class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 bg-white"
            >
                <option value="borrador">Borrador (Solo visible para Editores)</option>
                <option value="publicado">Publicado (Visible para toda la empresa)</option>
            </select>
        </div>

        <!-- Botones de Acción -->
        <div class="flex justify-between pt-4">
            <!-- Botón Volver -->
            <button 
                type="button" 
                (click)="volverALista()"
                class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-lg shadow-sm text-gray-700 bg-gray-100 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150"
            >
                Volver a la Lista
            </button>
            
            <!-- Botón Guardar -->
            <button 
                type="submit" 
                class="inline-flex justify-center py-2 px-6 border border-transparent shadow-lg text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150"
            >
                Guardar y Crear Proceso
            </button>
        </div>

        <!-- Mensaje de Confirmación (Opcional) -->
        <div *ngIf="creacionExitosa" class="mt-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded-lg" role="alert">
            ¡Proceso <strong>{{ nuevoProceso.nombre }}</strong> creado con éxito!
        </div>

    </form>
</div>
